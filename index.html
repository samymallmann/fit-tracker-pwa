<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>FitTracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="marca"><h1>Fit<span class="ll">Tracker</span></h1><span class="lema">treino · comida · saúde</span></div>
    <span id="topDate" class="muted small"></span>
  </header>
  <div id="demoBar" class="demo-bar" hidden></div>

  <main>
    <section id="tab-freq" class="tab"></section>
    <section id="tab-treinos" class="tab" hidden></section>
    <section id="tab-comida" class="tab" hidden></section>
    <section id="tab-resumo" class="tab" hidden></section>
    <section id="tab-perfil" class="tab" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-act="tab" data-tab="freq" class="active"><span>🟩</span>Frequência</button>
    <button data-act="tab" data-tab="treinos"><span>🏋️</span>Treinos</button>
    <button data-act="tab" data-tab="comida"><span>🍽️</span>Comida</button>
    <button data-act="tab" data-tab="resumo"><span>📊</span>Resumo</button>
    <button data-act="tab" data-tab="perfil"><span>👤</span>Perfil</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="firebase-config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
  <script src="nuvem.js"></script>
</body>
</html>
